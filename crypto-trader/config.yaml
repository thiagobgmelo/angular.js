# Configuração do sistema de trading
exchange:
  id: binance          # qualquer id suportado pelo ccxt (bybit, okx, coinbase...)
  rate_limit: true

market:
  pairs:               # usado quando screener.enabled=false (universo estático)
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
  timeframes:
    - 15m
    - 1h
    - 4h
    - 1d
  candles: 400         # candles buscados por análise (mín. ~250 p/ EMA 200)

screener:              # descoberta dinâmica do universo monitorado
  enabled: true
  quote: USDT
  min_quote_volume_24h: 20000000   # US$ 20M/24h — liquidez como proxy de confiança
  min_history_days: 180            # exclui listagens recentes sem histórico
  max_pairs: 25                    # limite de streams/CPU (ranking por volume)
  refresh_hours: 6                 # re-screening periódico do universo
  always_include:                  # majors sempre presentes, imunes ao corte
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
  exclude: []                      # denylist manual

strategy:
  score_threshold: 4       # score mínimo de confluência para emitir sinal
  min_risk_reward: 1.5     # R:R mínimo até o TP1
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  ema_fast: 50
  ema_slow: 200
  atr_period: 14
  bb_period: 20
  bb_std: 2.0
  volume_ma: 20
  swing_lookback: 5        # candles de cada lado para fractal de swing
  sr_zone_tolerance: 0.005 # 0.5% para agrupar pivôs em zonas de S/R

risk:
  account_equity: 10000    # capital inicial da carteira paper (USDT)
  risk_per_trade: 0.01     # 1% de risco por trade
  max_open_positions: 5
  max_leverage: 10         # teto da alavancagem sugerida (perpétuos)
  liq_buffer: 3.0          # liquidação deve ficar >= 3x além da distância do stop

radar:
  min_score: 3             # score mínimo para aviso de oportunidade em formação

execution:                 # execução real (Bybit perpétuos; dry-run sem chaves)
  mode: "off"              # off | manual | auto — alternável em runtime (/modo, API)
  approval_ttl_min: 15     # validade da aprovação no modo manual
  max_daily_loss_pct: 0.03 # circuit breaker: perda diária máx (% do capital)
  max_trades_per_day: 6    # circuit breaker: entradas máximas por dia
  max_consecutive_errors: 3  # pausa automática após N erros de ordem seguidos

paper:
  db_path: paper_trading.db

feed:                      # modo ao vivo (watch/serve)
  mode: websocket          # websocket (sub-segundo) | rest (fallback alinhado ao relógio)
  tick_throttle_ms: 1000   # intervalo mínimo entre processamentos de tick por símbolo
  stale_after_s: 90        # watchdog: reinicia streams sem eventos além disso

scanner:
  interval_seconds: 300    # usado apenas pelo comando batch `scan` em loop externo
